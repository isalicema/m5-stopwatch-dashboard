; ─────────────────────────────────────────────────────────────────────────
; M0：IMU / RTC 标定小程序（一次性工具，独立于正式固件）
;
; 目的：读出 M5Stack StopWatch 上 BMI270 的「默认轴向」——平放/朝下/竖直/
;       左右倾时 ax/ay/az 各是多少、重力落在哪个轴，并确认 RTC 可读。
;       结果用来给正式固件的 imu_logic.h 定标轴向常量。
;
; 用法（在本目录 firmware/tools/imu_cal/ 下执行）：
;   pio run -t upload                 # 编译并烧录（只写 app 分区，NVS/配网不动）
;   pio device monitor -b 115200      # 看串口读数（也可直接看设备屏幕）
;
; 标定完成后恢复正式固件（二选一）：
;   cd ../..                          # 回到 firmware/
;   pio run -e m5stack-stopwatch-uac -t upload      # 重新编译烧录正式 UAC 固件
;   # 或用 GitHub Release 中的成品镜像直接刷 0x10000
;
; 说明：本工具用 board=esp32s3box + M5Unified 自动检测，与正式固件同一套板级
;       识别，所以读到的轴向与 M1 里将看到的完全一致。
; ─────────────────────────────────────────────────────────────────────────
[env:imucal]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/m5stack/M5Unified
  https://github.com/m5stack/M5GFX
  https://github.com/m5stack/M5PM1
  https://github.com/m5stack/M5IOE1
