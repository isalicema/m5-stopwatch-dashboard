[platformio]
src_dir = M5Dashboard

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
extra_scripts =
  pre:scripts/embed_ui_font.py
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
  https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
  https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
  https://github.com/m5stack/M5IOE1.git#846eec7d05e25c09013be2acdb8804487f48a62e
  bblanchon/ArduinoJson @ 7.4.3

[env:m5stack-stopwatch-uac]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32s3box
framework = arduino
extra_scripts =
  pre:scripts/embed_ui_font.py
  pre:scripts/patch_m5unified_mic_dc_servo.py
upload_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  -DM5DASH_USB_AUDIO=1
  -DM5DASH_DISABLE_M5_MIC_DC_SERVO=1
lib_deps =
  https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
  https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
  https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
  https://github.com/m5stack/M5IOE1.git#846eec7d05e25c09013be2acdb8804487f48a62e
  bblanchon/ArduinoJson @ 7.4.3
